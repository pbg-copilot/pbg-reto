server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  # $request_id es aleatorio por respuesta: sirve de nonce para la CSP.
  # Vite marca el HTML con __CSP_NONCE__ (html.cspNonce) y aquí se reemplaza.
  set $csp_nonce $request_id;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce'; style-src 'self' 'nonce-$csp_nonce'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # La app llama a la API bajo /api/… y aquí se quita el prefijo. Así las rutas de la
  # interfaz (/tickets/:id) no chocan con las de la API (/tickets/:id).
  # Va primero: en nginx gana la primera regex que coincide.
  # Subida de adjuntos: hasta 5 archivos de 10 MB (spec 006).
  location ~ ^/api/(tickets/[^/]+/attachments|support/conversations/[^/]+/attachments)$ {
    client_max_body_size 55m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Contrato del repo base: también se sirven sin prefijo.
  location /auth/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://backend:8000; }
  # Swagger UI aplica estilos inline: solo aquí se permiten (la app mantiene la CSP estricta).
  location /docs {
    proxy_pass http://backend:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  location / {
    expires -1;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter "__CSP_NONCE__" $csp_nonce;
    try_files $uri $uri/ /index.html;
  }
}
