name: pbg-reto
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reto_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-reto}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-reto}:${POSTGRES_PASSWORD:-reto_local_only}@postgres:5432/${POSTGRES_DB:-reto}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-123456}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      SEED_FILE: /app/data/seed.json.gz
      PORT: 8000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8008}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    init: true
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
