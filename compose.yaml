name: pbg-reto

# Configuración común de la API y el worker (misma imagen, distinto comando).
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER:-reto}:${POSTGRES_PASSWORD:-reto_local_only}@postgres:5432/${POSTGRES_DB:-reto}
    DATA_DIR: /app/data
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
    PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8088}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-123456}
    SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
    AI_PROVIDER: ${AI_PROVIDER:-}
    AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    AI_FAKE_FAILURE: ${AI_FAKE_FAILURE:-false}
    S3_ENDPOINT: http://s3:9000
    S3_BUCKET: ${S3_BUCKET:-reto-attachments}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-reto}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-reto_local_only}
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    EMAIL_NOTIFICATIONS: ${EMAIL_NOTIFICATIONS:-true}
  restart: unless-stopped
  init: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reto_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-reto}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
    volumes:
      - postgres_replica_v2:/var/lib/postgresql/data
      - ./data/postgres:/seed:ro
      - ./database/init/10-restore.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB && PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -Atc 'SELECT 1 FROM onboarding.accounts LIMIT 1' >/dev/null",
        ]
      interval: 3s
      timeout: 3s
      retries: 120
      # La primera restauración tarda varios minutos: no se marca unhealthy mientras tanto.
      start_period: 15m
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8008}:8000"
    environment:
      <<: *backend-env
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    depends_on:
      backend:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('fs').statSync('/tmp/worker-heartbeat');process.exit(Date.now()-s.mtimeMs<30000?0:1)",
        ]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Almacenamiento de adjuntos compatible con S3 (bucket privado). Ver ADR 0004.
  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-reto}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-reto_local_only}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3_data:/data
    restart: unless-stopped

  # Buzón local: captura los correos de notificación sin enviarlos a nadie.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

volumes:
  postgres_replica_v2:
  s3_data:
